<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Browser Check</title>
    <link rel="stylesheet" href="../vendor/leaflet.css">
    <style>
      body {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        margin: 24px;
      }

      pre {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Browser Check</h1>
    <pre id="result">Running...</pre>
    <script src="../vendor/leaflet.js"></script>
    <script src="../vendor/togeojson.umd.js"></script>
    <script src="../vendor/exifr.full.umd.js"></script>
    <script type="module">
      import { parseGpxFile } from "../js/gpx.js";
      import { extractCheckpoint } from "../js/photos.js";
      import { formatSixFigureGridRef } from "../js/gridref.js";
      import { extractExifTiffFromHeicBuffer } from "../js/heic-exif.js";
      import { downloadCheckpointCsv, makeCheckpointCsv, makeCheckpointGeojson } from "../js/export.js";

      function u16(value) {
        return [value & 0xff, value >> 8 & 0xff];
      }

      function u32(value) {
        return [value & 0xff, value >> 8 & 0xff, value >> 16 & 0xff, value >> 24 & 0xff];
      }

      function ifdEntry(tag, type, count, valueOrOffset) {
        return [...u16(tag), ...u16(type), ...u32(count), ...u32(valueOrOffset)];
      }

      function rational(numerator, denominator) {
        return [...u32(numerator), ...u32(denominator)];
      }

      function makeGpsJpeg() {
        const tiffHeader = [
          0x49, 0x49, 0x2a, 0x00,
          ...u32(8),
          ...u16(1),
          ...ifdEntry(0x8825, 4, 1, 26),
          ...u32(0)
        ];
        const gpsDataOffset = 26 + 2 + 4 * 12 + 4;
        const gpsIfd = [
          ...u16(4),
          ...ifdEntry(1, 2, 2, 0x00004e),
          ...ifdEntry(2, 5, 3, gpsDataOffset),
          ...ifdEntry(3, 2, 2, 0x000057),
          ...ifdEntry(4, 5, 3, gpsDataOffset + 24),
          ...u32(0)
        ];
        const rationals = [
          ...rational(50, 1), ...rational(52, 1), ...rational(2568, 100),
          ...rational(0, 1), ...rational(0, 1), ...rational(3168, 100)
        ];
        const exifPayload = [
          0x45, 0x78, 0x69, 0x66, 0x00, 0x00,
          ...tiffHeader,
          ...gpsIfd,
          ...rationals
        ];
        const app1Length = exifPayload.length + 2;
        return new Uint8Array([
          0xff, 0xd8,
          0xff, 0xe1, app1Length >> 8 & 0xff, app1Length & 0xff,
          ...exifPayload,
          0xff, 0xd9
        ]);
      }

      function box(type, payload) {
        const bytes = new TextEncoder().encode(type);
        return new Uint8Array([
          ...u32be(payload.length + 8),
          ...bytes,
          ...payload
        ]);
      }

      function u16be(value) {
        return [value >> 8 & 0xff, value & 0xff];
      }

      function u32be(value) {
        return [value >> 24 & 0xff, value >> 16 & 0xff, value >> 8 & 0xff, value & 0xff];
      }

      function makeMinimalHeicWithExif() {
        const jpeg = makeGpsJpeg();
        const app1Length = jpeg[4] << 8 | jpeg[5];
        const exifPayload = jpeg.subarray(6, 6 + app1Length - 2);
        const heicExifPayload = new Uint8Array([
          ...u32be(6),
          ...exifPayload
        ]);
        const ftyp = box("ftyp", new Uint8Array([
          0x68, 0x65, 0x69, 0x63,
          0x00, 0x00, 0x00, 0x00,
          0x68, 0x65, 0x69, 0x63
        ]));
        const infePayload = new Uint8Array([
          0x02, 0x00, 0x00, 0x00,
          ...u16be(1),
          ...u16be(0),
          0x45, 0x78, 0x69, 0x66,
          0x00
        ]);
        const iinfPayload = new Uint8Array([
          0x00, 0x00, 0x00, 0x00,
          ...u16be(1),
          ...box("infe", infePayload)
        ]);
        const ilocLengthBeforeOffset = 4 + 2 + 2 + 2 + 2 + 0 + 2;
        const ilocPayloadLength = ilocLengthBeforeOffset + 4 + 4;
        const metaSize = 8 + 4 + (8 + iinfPayload.length) + (8 + ilocPayloadLength);
        const mdatPayloadOffset = ftyp.length + metaSize + 8;
        const ilocPayload = new Uint8Array([
          0x01, 0x00, 0x00, 0x00,
          0x44, 0x00,
          ...u16be(1),
          ...u16be(1),
          ...u16be(0),
          ...u16be(0),
          ...u16be(1),
          ...u32be(mdatPayloadOffset),
          ...u32be(heicExifPayload.length)
        ]);
        const meta = box("meta", new Uint8Array([
          0x00, 0x00, 0x00, 0x00,
          ...box("iinf", iinfPayload),
          ...box("iloc", ilocPayload)
        ]));
        const mdat = box("mdat", heicExifPayload);
        const result = new Uint8Array(ftyp.length + meta.length + mdat.length);
        result.set(ftyp, 0);
        result.set(meta, ftyp.length);
        result.set(mdat, ftyp.length + meta.length);
        return result;
      }

      async function run() {
        const gpxText = await fetch("./sample-route.gpx").then((response) => response.text());
        const route = await parseGpxFile(new File([gpxText], "sample-route.gpx", { type: "application/gpx+xml" }));
        const checkpointResult = await extractCheckpoint(new File([makeGpsJpeg()], "gps-checkpoint.jpg", { type: "image/jpeg" }));
        const heicTiff = extractExifTiffFromHeicBuffer(makeMinimalHeicWithExif().buffer);
        const warningResult = await extractCheckpoint(new File([new Uint8Array([0xff, 0xd8, 0xff, 0xd9])], "no-gps.jpg", { type: "image/jpeg" }));

        const checks = {
          routeName: route.displayName,
          routeFeatureCount: route.geojson.features.length,
          routeBoundsValid: route.bounds.isValid(),
          checkpointType: checkpointResult.type,
          checkpointGridRef: checkpointResult.checkpoint?.gridRef,
          heicTiffStartsWith: String.fromCharCode(...new Uint8Array(heicTiff, 0, 4)),
          heicTiffByteLength: heicTiff.byteLength,
          warningType: warningResult.type,
          warningMessage: warningResult.message,
          directGridRef: formatSixFigureGridRef(50.8738, -0.0088),
          csvIncludesGridRef: makeCheckpointCsv(
            [
              "order",
              "name",
              "source",
              "latitude",
              "longitude",
              "os_grid_ref",
              "via_grid_refs",
              "route_name",
              "distance_along_route_miles",
              "distance_from_previous_miles",
              "target_speed",
              "checkpoint_stop_minutes",
              "time_from_previous_minutes",
              "arrival_time",
              "departure_time",
              "off_route_meters",
              "timestamp",
              "status"
            ],
            [[
              checkpointResult.checkpoint.orderIndex,
              checkpointResult.checkpoint.displayName || checkpointResult.checkpoint.filename,
              checkpointResult.checkpoint.filename,
              checkpointResult.checkpoint.latitude.toFixed(7),
              checkpointResult.checkpoint.longitude.toFixed(7),
              checkpointResult.checkpoint.gridRef,
              "",
              checkpointResult.checkpoint.routeName,
              "",
              "",
              "3 mph",
              "",
              "",
              "",
              "",
              "",
              checkpointResult.checkpoint.timestamp,
              checkpointResult.checkpoint.status
            ]]
          ).includes(checkpointResult.checkpoint.gridRef),
          geojsonFeatureCount: makeCheckpointGeojson([checkpointResult.checkpoint]).features.length,
          exportFunctionAvailable: typeof downloadCheckpointCsv === "function"
        };
        if (checks.heicTiffStartsWith !== "II*\u0000" || checks.heicTiffByteLength === 0) {
          throw new Error("HEIC Exif payload extraction failed.");
        }
        if (!checks.csvIncludesGridRef || checks.geojsonFeatureCount !== 1) {
          throw new Error("Checkpoint export checks failed.");
        }
        document.documentElement.dataset.checkStatus = "pass";
        document.querySelector("#result").textContent = JSON.stringify(checks, null, 2);
      }

      run().catch((error) => {
        document.documentElement.dataset.checkStatus = "fail";
        document.querySelector("#result").textContent = error.stack || error.message;
      });
    </script>
  </body>
</html>
