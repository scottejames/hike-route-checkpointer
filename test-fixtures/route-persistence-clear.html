<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Route Persistence Clear</title>
  </head>
  <body>
    <script>
      const key = "hike-route-checkpointer.routes.v1";
      try {
        const saved = JSON.parse(localStorage.getItem(key) || "null");
        if (saved?.routes?.some((route) => route.id === "test-sussex-route")) {
          localStorage.removeItem(key);
        }
      } catch {
        localStorage.removeItem(key);
      }
      location.replace("/?persistenceClear=1");
    </script>
  </body>
</html>
